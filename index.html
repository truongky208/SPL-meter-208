<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPL Meter - Acoustic Space Design</title>
  
  <!-- Cấu hình PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">
  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur">
    <h1 class="text-xl font-bold tracking-wider text-emerald-400">SPL METER</h1>
    <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">PWA Ready</span>
  </header>

  <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col justify-between gap-6">
    <!-- SPL Display -->
    <div class="flex flex-col items-center justify-center py-8 bg-slate-900/80 rounded-2xl border border-slate-800 shadow-xl">
      <div class="text-xs uppercase tracking-widest text-slate-400 mb-2">Sound Pressure Level</div>
      <div id="spl-val" class="text-6xl font-black font-mono tracking-tight text-emerald-400">00.0</div>
      <div class="text-sm font-semibold text-slate-500 mt-1">dBA</div>
    </div>

    <!-- Controls -->
    <div class="space-y-4">
      <button id="btn-start" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-lg shadow-lg shadow-emerald-500/20 transition-all active:scale-[0.98]">
        BẮT ĐẦU ĐO
      </button>

      <!-- Calib Section -->
      <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800/80 space-y-3">
        <label class="block text-xs font-medium text-slate-300">Hiệu chuẩn Mic ngoài (Offset dB)</label>
        <div class="flex gap-2">
          <input type="number" id="calib-offset" value="0.0" step="0.1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono focus:outline-none focus:border-emerald-500">
          <button id="btn-save-calib" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold border border-slate-700 transition">
            Lưu
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Đăng ký Service Worker cho PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered!'))
          .catch(err => console.log('SW failed: ', err));
      });
    }
  </script>
</body>
</html>
